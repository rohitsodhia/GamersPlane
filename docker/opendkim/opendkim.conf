BaseDirectory           /var/run/opendkim

LogWhy                  yes
Syslog                  yes
SyslogSuccess           yes

Canonicalization        relaxed/simple

Domain                  gamersplane.com
Selector                key_selector
KeyFile                 /etc/opendkim/keys/key.private

Socket                  inet:8891
##Socket                  inet:8891@localhost
##Socket                        local:opendkim.sock

ReportAddress           postmaster@gamersplane.com
SendReports             yes

# 172.30.25.0/24 is the "mail" docker network defined in compose.email.yml (keep in sync, also in postfix main.cf)
InternalHosts           127.0.0.1, 172.30.25.0/24

PidFile         /var/run/opendkim/opendkim.pid
